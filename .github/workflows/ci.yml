name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: "PHP 8.5 / Dependencies ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        dependencies: [stable, lowest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: iconv, mbstring
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php85-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php85-${{ matrix.dependencies }}-

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install stable dependencies
        if: matrix.dependencies == 'stable'
        run: composer update --prefer-dist --no-interaction

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction

      - name: Lint PHP source
        run: composer lint

      - name: Run test suite
        run: composer test
